name: Update Biss Keys

on:
  schedule:
    - cron: "*/30 * * * *"   # كل 30 دقيقة - غيّرها زي ما تحب (خليها زي اللي عندك)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install playwright cloudscraper beautifulsoup4
          playwright install --with-deps chromium

      - name: Run Script
        run: python bisskey.py --debug

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bisskeys.json
          git diff --staged --quiet || git commit -m "Update biss keys"
          git push

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            debug_card.html
            debug_requests.txt
          if-no-files-found: ignore
