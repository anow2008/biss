name: Forme

on:
  schedule:
    - cron: "*/15 * * * *"   # خليها زي الـ cron اللي عندك في الملف القديم
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # مثبّتة على 24.04 عشان Playwright والـ Python مدعومين فيها
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install playwright cloudscraper beautifulsoup4
          playwright install --with-deps chromium

      - name: Run Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SAT_USER: ${{ secrets.SAT_USER }}
          SAT_PASS: ${{ secrets.SAT_PASS }}
        run: python Forme.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_keys_list.txt "for me.json"
          git diff --staged --quiet || git commit -m "Update keys"
          git push
